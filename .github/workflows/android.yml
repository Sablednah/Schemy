name: Build Android app

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Sync Android project
        run: pnpm android:sync

      - name: Restore Android release key
        if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/schemy-release.p12

      - name: Build APK
        working-directory: android
        env:
          BUILD_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
          ANDROID_KEYSTORE_PATH: schemy-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            ./gradlew assembleRelease
            VERSION=$(node -p "require('../package.json').version")
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Schemy-Android-v${VERSION}.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/release/Schemy-Android-v${VERSION}.apk"
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release == true) && 'schemy-android-release' || 'schemy-android-debug' }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/Schemy-Android-*.apk
          if-no-files-found: error
